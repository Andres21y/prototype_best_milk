<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./admin.css">
    <title>Admin</title>
</head>

<body>

    <div id="navbar-section"></div>

    <div class="admin-container">

        <div class="header-card">
            <div class="card-content">
                <div class="row valign-wrapper">
                    <div class="col s2">
                        <a href="#" data-target="slide-out" class="sidenav-trigger">
                            <i class="material-icons medium white-text">menu</i>
                        </a>
                    </div>
                    <div class="col s8">
                        <h5 class="white-text" style="margin: 0;">BestMilk Admin</h5>
                        <p class="white-text" style="margin: 0; opacity: 0.9;">BestMilk</p>
                    </div>
                </div>
            </div>
        </div>


        <!-- Modals -->
        <div id="modal-ganado" class="modal modal-fixed-footer">
            <div class="modal-content indigo-text text-darken-4 ">
                <h4><i class="material-icons left">pets</i>Registrar Nuevo Ganado</h4>
                <form id="form-ganado">
                    <div class="row">
                        <div class="input-field col s12 m6">
                            <input id="ganado-id" type="text" class="validate" required>
                            <label for="ganado-id">ID del Ganado *</label>
                        </div>
                        <div class="input-field col s12 m6">
                            <input id="ganado-nombre" type="text" class="validate" required>
                            <label for="ganado-nombre">Nombre *</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12 m6">
                            <select id="ganado-raza" required>
                                <option value="" disabled selected>Selecciona una raza</option>
                                <option value="Holstein">Holstein</option>
                                <option value="Jersey">Jersey</option>
                                <option value="Angus">Angus</option>
                                <option value="Brahman">Brahman</option>
                                <option value="Simmental">Simmental</option>
                                <option value="Charolais">Charolais</option>
                            </select>
                            <label>Raza *</label>
                        </div>
                        <div class="input-field col s12 m6">
                            <select id="ganado-sexo" required>
                                <option value="" disabled selected>Selecciona el sexo</option>
                                <option value="Hembra">Hembra</option>
                                <option value="Macho">Macho</option>
                            </select>
                            <label>Sexo *</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12 m6">
                            <input id="ganado-nacimiento" type="date" class="validate" required>
                            <label for="ganado-nacimiento">Fecha de Nacimiento *</label>
                        </div>
                        <div class="input-field col s12 m6">
                            <input id="ganado-peso" type="number" class="validate" min="0" step="0.1">
                            <label for="ganado-peso">Peso (kg)</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12 m6">
                            <input id="ganado-madre" type="text" class="validate">
                            <label for="ganado-madre">ID de la Madre</label>
                        </div>
                        <div class="input-field col s12 m6">
                            <input id="ganado-padre" type="text" class="validate">
                            <label for="ganado-padre">ID del Padre</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <textarea id="ganado-observaciones" class="materialize-textarea"></textarea>
                            <label for="ganado-observaciones">Observaciones</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <a href="#!" class="modal-close waves-effect waves-light btn-flat">Cancelar</a>
                <a href="#!" class="waves-effect waves-light btn green" onclick="guardarGanado()">
                    <i class="material-icons left">save</i>Guardar
                </a>
            </div>
        </div>

        <div id="modal-personal" class="modal modal-fixed-footer">
            <div class="modal-content indigo-text text-darken-4 ">
                <h4><i class="material-icons left">people</i>Registrar Nuevo Personal</h4>
                <form id="form-personal">
                    <div class="row">
                        <div class="input-field col s12 m6">
                            <input id="personal-nombre" type="text" class="validate" required>
                            <label for="personal-nombre">Nombre Completo *</label>
                        </div>
                        <div class="input-field col s12 m6">
                            <input id="personal-cedula" type="text" class="validate" required>
                            <label for="personal-cedula">Cédula *</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12 m6">
                            <select id="personal-cargo" required>
                                <option value="" disabled selected>Selecciona un cargo</option>
                                <option value="Ordeñador">Ordeñador</option>
                                <option value="Veterinario">Veterinario</option>
                                <option value="Alimentador">Alimentador</option>
                                <option value="Supervisor">Supervisor</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                            </select>
                            <label>Cargo *</label>
                        </div>
                        <div class="input-field col s12 m6">
                            <select id="personal-turno" required>
                                <option value="" disabled selected>Selecciona un turno</option>
                                <option value="Mañana">Mañana (6:00 - 14:00)</option>
                                <option value="Tarde">Tarde (14:00 - 22:00)</option>
                                <option value="Noche">Noche (22:00 - 6:00)</option>
                                <option value="Completo">Tiempo Completo</option>
                            </select>
                            <label>Turno *</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12 m6">
                            <input id="personal-telefono" type="tel" class="validate">
                            <label for="personal-telefono">Teléfono</label>
                        </div>
                        <div class="input-field col s12 m6">
                            <input id="personal-email" type="email" class="validate">
                            <label for="personal-email">Email</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12 m6">
                            <input id="personal-ingreso" type="date" class="validate" required>
                            <label for="personal-ingreso">Fecha de Ingreso *</label>
                        </div>
                        <div class="input-field col s12 m6">
                            <input id="personal-salario" type="number" class="validate" min="0" step="0.01">
                            <label for="personal-salario">Salario</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <textarea id="personal-direccion" class="materialize-textarea"></textarea>
                            <label for="personal-direccion">Dirección</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <a href="#!" class="modal-close waves-effect waves-light btn-flat">Cancelar</a>
                <a href="#!" class="waves-effect waves-light btn blue" onclick="guardarPersonal()">
                    <i class="material-icons left">save</i>Guardar
                </a>
            </div>
        </div>

        <!-- Modal de Confirmación de Salida -->
        <div id="modal-logout" class="modal md_logout indigo-text text-darken-4 ">
            <div class="modal-content center-align">
                <i class="material-icons large white-text">exit_to_app</i>
                <h4>Confirmar Salida</h4>
                <p>¿Estás seguro que deseas cerrar sesión?</p>
                <p class="grey-text">Se perderán los cambios no guardados.</p>
            </div>
            <div class="modal-footer">
                <a href="#!" class="modal-close waves-effect waves-light btn-flat">Cancelar</a>
                <a href="#!" class="waves-effect waves-light btn red" onclick="logout()">
                    <i class="material-icons left">exit_to_app</i>Cerrar Sesión
                </a>
            </div>
        </div>

        <!-- boton flotante -->
        <div class="fab-menu">
            <button class="btn-floating btn-large green waves-effect waves-light" onclick="showSection('dashboard')">
                <i class="material-icons">home</i>
            </button>
        </div>

        <div id="dashboard-section" class="content-section active"> </div>
        <div id="ganado-section" class="content-section"></div>
        <div id="personal-section" class="content-section"></div>
        <div id="analytic-section" class="content-section"></div>
        <div id="produccion-section" class="content-section"></div>
        <div id="salud-section" class="content-section"></div>
        <div id="alimentacion-section" class="content-section"></div>
        <div id="reportes-section" class="content-section"> </div>
        <div id="config-section" class="content-section white"> </div>
    </div>


    <script src="../../components/admin/Navbar.js"></script>
    <script src="/components/admin/Dashboard.js"></script>
    <script src="/components/admin/Ganado.js"></script>
    <script src="/components/admin/Personal.js"></script>
    <script src="/components/admin/Analytic.js"></script>
    <script src="/components/admin/Production.js"></script>
    <script src="/components/admin/Health.js"></script>
    <script src="/components/admin/Feed.js"></script>
    <script src="/components/admin/Report.js"></script>
    <script src="/components/admin/Config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="./admin.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>

</html>
